@if (cliente) {
  <div class="card_de_informacoes_do_cliente">
    <div class="card_de_informacoes_do_cliente__cabecalho">
      <div class="card_de_informacoes_do_cliente__cabecalho_titulo">
        <img class="card_de_informacoes_do_cliente__cabecalho_icone" src="/icones/icon-client.png" alt="Cliente" />
        <h1>Informações do Cliente</h1>
      </div>
    </div>

    <div class="card_de_informacoes_do_cliente__conteudo">
      <div class="card_de_informacoes_do_cliente__conteudo_item">
        <p>Nome</p>
        <p>{{ cliente.nome }}</p>
      </div>

      <div class="card_de_informacoes_do_cliente__conteudo_linha"></div>

      <div class="card_de_informacoes_do_cliente__conteudo_item">
        <p>Idade</p>
        <p>{{ cliente.idade }} anos</p>
      </div>

      <div class="card_de_informacoes_do_cliente__conteudo_linha"></div>

      <div class="card_de_informacoes_do_cliente__conteudo_item">
        <p>Renda Mensal</p>
        <p>{{ cliente.rendaMensal.toNumber() | currency:'BRL' }}</p>
      </div>

      <div class="card_de_informacoes_do_cliente__conteudo_linha"></div>

      <div class="card_de_informacoes_do_cliente__conteudo_item">
        <p>Nacionalidade</p>
        <p>{{ cliente.nacionalidade }}</p>
      </div>
    </div>
  </div>
}
